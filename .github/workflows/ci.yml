name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Nx Cloud is not set up: nx.json carries no nxCloudId, so the previous
      # `nx start-ci-run`, `nx record` and `nx fix-ci` steps had nothing to talk
      # to. Restore them after connecting the workspace with `npx nx connect`.

      # Read from .nvmrc so CI, local shells and the Docker images cannot drift
      # apart. It tracks the Node major the runtime images are built on.
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check --base="remotes/origin/main"
      # No e2e project exists yet; listing the target here made it a silent
      # no-op that read like coverage. Add it back alongside the project.
      - run: npx nx run-many -t lint test build typecheck

<div class="login-page">
  <div class="login-brand">
    <div class="login-logo">VOS</div>
    <h1 class="login-title">Villa OS</h1>
    <p class="login-tagline">Villa yönetim paneline giriş yap</p>
  </div>

  <nz-card class="login-card">
    <form nz-form [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzFor="username" nzNoColon class="sr-only">Kullanıcı adı</nz-form-label>
        <nz-form-control>
          <nz-input-group nzPrefixIcon="user">
            <input
              id="username"
              type="text"
              nz-input
              formControlName="username"
              placeholder="Kullanıcı adı"
              autocomplete="username"
            />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password" nzNoColon class="sr-only">Şifre</nz-form-label>
        <nz-form-control>
          <nz-input-group nzPrefixIcon="lock">
            <input
              id="password"
              type="password"
              nz-input
              formControlName="password"
              placeholder="Şifre"
              autocomplete="current-password"
            />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      @if (errorMessage(); as message) {
        <nz-alert nzType="error" [nzMessage]="message" nzShowIcon class="form-alert"></nz-alert>
      }

      <button
        nz-button
        nzType="primary"
        nzBlock
        nzSize="large"
        type="submit"
        [nzLoading]="loading()"
        [disabled]="form.invalid"
      >
        Giriş yap
      </button>
    </form>
  </nz-card>
</div>

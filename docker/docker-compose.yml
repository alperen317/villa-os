# The browser only ever talks to WEB_PORT: nginx proxies /api and /uploads to
# the api service, so both ports below can be changed freely without touching
# application code. API_PORT just exposes the API directly for Swagger and
# debugging.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-villaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-villaos}
      POSTGRES_DB: ${POSTGRES_DB:-villaos}
    ports:
      # Loopback-only. The API reaches Postgres over the compose network, so
      # this mapping exists purely for local DB clients — publishing it on
      # 0.0.0.0 would expose the database to the internet on a server. If the
      # host port is taken, override POSTGRES_PORT in docker/.env.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-villaos}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback-only, same reasoning as postgres above.
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-villaos}:${POSTGRES_PASSWORD:-villaos}@postgres:5432/${POSTGRES_DB:-villaos}?schema=public
      REDIS_URL: redis://redis:6379
      # AuthService reads all four with getOrThrow — a missing TTL crashes login.
      # The secrets have no default on purpose: a fallback value ships the same
      # signing key to every deployment, letting anyone mint an Administrator
      # access token. `:?` makes compose refuse to start until they are set.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?missing — copy docker/.env.example to docker/.env and set a generated value}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?missing — copy docker/.env.example to docker/.env and set a generated value}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
    volumes:
      # Uploaded files (logo, etc.) live on disk; without this they vanish on
      # every container replacement.
      - api_uploads:/app/uploads
    ports:
      # Loopback-only, same reasoning as postgres and redis above: the web
      # container reaches the API over the compose network, so this mapping is
      # only for Swagger and debugging from the host. Publishing it on 0.0.0.0
      # would expose the API — and its docs — to the internet on a server.
      - '127.0.0.1:${API_PORT:-8084}:3000'
    healthcheck:
      # node rather than curl/wget: neither is installed in the slim runtime
      # image, and Node 22 has fetch built in.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8083}:80'

volumes:
  postgres_data:
  redis_data:
  api_uploads:

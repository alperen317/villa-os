server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Logo uploads; nginx defaults to 1m, which is low for image uploads.
  client_max_body_size 10m;

  # The API is proxied so the browser talks to a single origin — no CORS, and
  # host ports can change without rebuilding the web bundle.
  #
  # `^~` matters: it outranks the static-asset regex below, which would
  # otherwise swallow /uploads/logo.png and serve a 404 from the local root.
  location ^~ /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /uploads/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker and its manifest must always be revalidated, otherwise
  # clients pin themselves to a stale build. Exact-match locations take
  # priority over the regex block below, so these win.
  location = /ngsw.json {
    add_header Cache-Control "no-cache" always;
  }

  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Translation bundles are not fingerprinted the way the JS/CSS output is, so
  # without this a browser's heuristic caching can pin a user to the wording of
  # a previous deploy. `^~` keeps the SPA fallback from serving index.html for a
  # mistyped locale, which would otherwise reach the loader as broken JSON.
  location ^~ /i18n/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Production builds use outputHashing: all, so these filenames are unique
  # per build and safe to cache indefinitely.
  location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback: deep links and page refreshes resolve to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
